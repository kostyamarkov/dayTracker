<script>
  (() => {
    const weekdayNames = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
    const statusLabels = {
      office: 'Office',
      home: 'Home',
      unselected: 'Unselected',
      weekend: 'Weekend',
      holiday: 'Holiday',
      leave: 'Leave'
    };
    const statusDialog = document.getElementById('status-dialog');
    const calendarGrid = document.getElementById('calendar-grid');
    const saveState = document.getElementById('save-state');
    let selectedDate = null;
    let currentView = null;
    let loadSequence = 0;
    let saveQueue = Promise.resolve();

    const todayParts = new Intl.DateTimeFormat('en-CA', {
      timeZone: 'Europe/Lisbon',
      year: 'numeric',
      month: '2-digit'
    }).formatToParts(new Date());
    const initialYear = Number(todayParts.find((part) => part.type === 'year').value);
    const initialMonth = Number(todayParts.find((part) => part.type === 'month').value);
    let visibleYear = initialYear;
    let visibleMonth = initialMonth;

    function callServer(method, ...args) {
      return new Promise((resolve, reject) => {
        const runner = google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((error) => reject(new Error(error && error.message ? error.message : String(error))));
        runner[method](...args);
      });
    }

    function formatDate(dateKey, options) {
      const [year, month, day] = dateKey.split('-').map(Number);
      return new Intl.DateTimeFormat('en-GB', options).format(new Date(year, month - 1, day, 12));
    }

    function setConnection(state, label) {
      const dot = document.getElementById('connection-dot');
      dot.classList.toggle('is-ready', state === 'ready');
      dot.classList.toggle('is-error', state === 'error');
      document.getElementById('connection-label').textContent = label;
    }

    function setError(message) {
      setConnection('error', 'Connection error');
      saveState.textContent = message;
      saveState.classList.add('is-error');
    }

    function loadMonth(year, month) {
      const sequence = ++loadSequence;
      visibleYear = year;
      visibleMonth = month;
      setConnection('', 'Loading');
      document.getElementById('month-title').textContent = formatDate(`${year}-${String(month).padStart(2, '0')}-01`, {
        month: 'long', year: 'numeric'
      });

      callServer('getMonthData', year, month).then((view) => {
        if (sequence !== loadSequence) return;
        currentView = view;
        setConnection('ready', 'Connected');
        saveState.textContent = '';
        saveState.classList.remove('is-error');
        renderMonth(view);
      }).catch((error) => {
        if (sequence !== loadSequence) return;
        setError(error.message || 'Could not load this month.');
        renderLoadFailure();
      });
    }

    function renderLoadFailure() {
      calendarGrid.replaceChildren();
      const message = document.createElement('p');
      message.className = 'load-error';
      message.textContent = 'Check the spreadsheet setup and try again.';
      calendarGrid.append(message);
      document.getElementById('home-days').textContent = '--';
      document.getElementById('summary-message').textContent = 'The spreadsheet is not connected yet.';
    }

    function renderMonth(view) {
      document.getElementById('month-title').textContent = formatDate(`${view.year}-${String(view.month).padStart(2, '0')}-01`, {
        month: 'long', year: 'numeric'
      });
      renderCalendar(view);
      renderSummary(view);
    }

    function renderCalendar(view) {
      calendarGrid.replaceChildren();
      weekdayNames.forEach((name) => {
        const heading = document.createElement('div');
        heading.className = 'weekday-heading';
        heading.setAttribute('role', 'columnheader');
        heading.textContent = name;
        calendarGrid.append(heading);
      });

      const leadingDays = (view.firstWeekday + 6) % 7;
      const totalCells = Math.ceil((leadingDays + view.days.length) / 7) * 7;
      for (let index = 0; index < totalCells; index += 1) {
        const cell = document.createElement('div');
        cell.className = 'day-cell';
        cell.setAttribute('role', 'gridcell');
        const dayIndex = index - leadingDays;
        if (dayIndex < 0 || dayIndex >= view.days.length) {
          cell.classList.add('empty-cell');
          cell.setAttribute('aria-hidden', 'true');
          calendarGrid.append(cell);
          continue;
        }
        cell.append(createDayButton(view.days[dayIndex]));
        calendarGrid.append(cell);
      }
    }

    function createDayButton(day) {
      const button = document.createElement('button');
      const workMode = day.dayType === 'working' ? day.workMode : day.dayType;
      const label = day.dayType === 'holiday' && day.holidayName ? day.holidayName : statusLabels[workMode];
      const parts = day.date.split('-').map(Number);
      const todayDay = Number(new Intl.DateTimeFormat('en-GB', {
        timeZone: 'Europe/Lisbon', day: '2-digit'
      }).format(new Date()));
      const isToday = parts[0] === initialYear && parts[1] === initialMonth && parts[2] === todayDay;
      button.type = 'button';
      button.className = `day-button${isToday ? ' is-today' : ''}`;
      button.dataset.status = workMode;
      button.setAttribute('aria-label', `${formatDate(day.date, { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })}: ${label}`);
      button.setAttribute('aria-pressed', 'false');
      button.innerHTML = `<span class="day-number">${parts[2]}</span><span class="day-label"></span>`;
      button.querySelector('.day-label').textContent = label;
      button.addEventListener('click', () => openStatusDialog(day));
      return button;
    }

    function renderSummary(view) {
      document.getElementById('home-days').textContent = view.homeDays;
      const progress = document.getElementById('progress-track');
      progress.setAttribute('aria-valuenow', Math.min(view.homeDays, view.allowance));
      progress.setAttribute('aria-valuetext', `${view.homeDays} of ${view.allowance} days`);
      document.getElementById('progress-fill').style.width = `${view.progressPercent}%`;

      const message = document.getElementById('summary-message');
      message.classList.toggle('is-over', view.overLimit);
      if (view.overLimit) {
        const excess = view.homeDays - view.allowance;
        message.textContent = `${excess} day${excess === 1 ? '' : 's'} over the allowance. Status changes are not blocked.`;
      } else if (view.homeDays === view.allowance) {
        message.textContent = 'Monthly allowance reached.';
      } else {
        const remaining = view.allowance - view.homeDays;
        message.textContent = `${remaining} day${remaining === 1 ? '' : 's'} remaining in the monthly allowance.`;
      }
    }

    function openStatusDialog(day) {
      selectedDate = day.date;
      document.getElementById('dialog-date').textContent = formatDate(day.date, {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
      const selectedMode = day.dayType === 'working' ? day.workMode : day.dayType;
      statusDialog.querySelectorAll('.status-option').forEach((option) => {
        const optionStatus = option.dataset.dayType === 'working' ? option.dataset.workMode : option.dataset.dayType;
        option.setAttribute('aria-pressed', String(optionStatus === selectedMode));
        option.disabled = false;
      });
      statusDialog.showModal();
    }

    function saveStatus(dayType, workMode) {
      const dateKey = selectedDate;
      if (!dateKey) return;
      const [year, month] = dateKey.split('-').map(Number);
      statusDialog.close();
      saveState.textContent = `Saving ${formatDate(dateKey, { day: 'numeric', month: 'long' })}...`;
      saveState.classList.remove('is-error');

      saveQueue = saveQueue.then(() => callServer('saveDayStatus', dateKey, dayType, workMode)).then((view) => {
        if (visibleYear === year && visibleMonth === month) {
          currentView = view;
          renderMonth(view);
          saveState.textContent = 'Change saved';
        }
      }).catch((error) => {
        setError(error.message || 'Could not save this status.');
        if (currentView && visibleYear === year && visibleMonth === month) renderMonth(currentView);
      });
    }

    function shiftMonth(offset) {
      const next = new Date(Date.UTC(visibleYear, visibleMonth - 1 + offset, 1));
      loadMonth(next.getUTCFullYear(), next.getUTCMonth() + 1);
    }

    document.getElementById('previous-month').addEventListener('click', () => shiftMonth(-1));
    document.getElementById('next-month').addEventListener('click', () => shiftMonth(1));
    document.getElementById('current-month').addEventListener('click', () => loadMonth(initialYear, initialMonth));
    statusDialog.querySelectorAll('.status-option').forEach((option) => {
      option.addEventListener('click', () => saveStatus(option.dataset.dayType, option.dataset.workMode));
    });
    if (window.DAY_TRACKER_PREVIEW) {
      document.getElementById('preview-tag').hidden = false;
    }
    loadMonth(initialYear, initialMonth);
  })();
</script>
